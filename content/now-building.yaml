html_title: Building with AI @ musavvir.info
heading: Building with AI?
intro: Harnessing AI is a design skill. I treat LLMs and AI-IDEs as exoskeletons - they make the load up the mountain lighter, but they don't do the climbing for you.
cards:
  - title: Replacing an expensive Squarespace subscription with a free stack
    paragraph: I used to pay Squarespace €132 annually to park this website in a convenient way. Then I got a one-month €20 Cursor subscription to make a pixel-identical clone, and made it **free** to run using a GitHub + Sveltia + Cloudflare stack.
    cta_href: '#'
    cta_label: (Coming Soon) View repo on GitHub
  - title: A gift from ~~God~~ Musa for HSM job seekers
    paragraph: Are you tired of LinkedIn job browsing and messing with ghost job openings? What if you could simply ask your LLM model of choice which Dutch companies are likely to sponsor + hire you for your talent? This MCP server will do exactly that.
    cta_href: '#'
    cta_label: (Coming Soon) Fire it up
  - title: Building a native (iOS & Android) app which nudges you to daily pushups
    paragraph: I was fatigued by the plethora of choice for fitness apps, most of them bloated to a tee with unimportant features and interface fanciness, losing the forest for the tree. I instead needed something which focuses on habit building. So I started building a lean app, which will be made open source.
    cta_href: '#'
    cta_label: (Currently Dogfooding) View repo on GitHub
