# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: Sveltia CMS for musavvir.info
site_url: https://musavvir.info

logo:
  src: /assets/pro-pic-circular-musa.png
  show_in_header: true

backend:
  name: github
  repo: musavvirahmed/ss-to-gh
  branch: main
  auth_methods:
    - token

media_folder: public/assets
public_folder: /assets

collections:
  - name: site
    label: Site content
    files:
      - label: Homepage & footer
        name: site
        file: content/site.yaml
        format: yaml
        editor:
          preview: false
        fields:
          - label: City
            name: location
            widget: string
            hint: Shown in your homepage bio, e.g. "Den Haag"
          - label: Profile photo
            name: avatar
            widget: image
            hint: Circular headshot on the homepage
          - label: Résumé file
            name: resume_pdf
            widget: string
            hint: Path on this site, e.g. /s/musa-resume-2026.pdf
          - label: Homepage bio
            name: bio
            widget: object
            collapsed: false
            fields:
              - label: Bio paragraphs
                name: paragraphs
                widget: list
                label_singular: paragraph
                summary: "{{fields.paragraph}}"
                field:
                  label: Text
                  name: paragraph
                  widget: markdown
              - label: Highlighted phrases
                name: highlights
                widget: list
                label_singular: highlight
                summary: "{{fields.phrase}} ({{fields.style}})"
                fields:
                  - label: Exact words in bio
                    name: phrase
                    widget: string
                  - label: Decoration
                    name: style
                    widget: select
                    options:
                      - underline
                      - scribble
                  - label: Bold
                    name: bold
                    widget: boolean
                    required: false
                  - label: Link (optional)
                    name: href
                    widget: string
                    required: false
          - label: Footer links
            name: footer_links
            widget: list
            label_singular: footer link
            summary: "{{fields.label}}"
            fields:
              - label: Link text
                name: label
                widget: string
              - label: Web address
                name: href
                widget: string
                hint: https://… or /s/… for on-site files
      - label: Page not found (404)
        name: not-found
        file: content/not-found.yaml
        format: yaml
        editor:
          preview: false
        fields:
          - label: Title
            name: heading
            widget: string
            hint: Large heading at the top of the 404 page
          - label: Message
            name: lines
            widget: list
            label_singular: line
            summary: "{{fields.line}}"
            field:
              label: Text
              name: line
              widget: markdown
